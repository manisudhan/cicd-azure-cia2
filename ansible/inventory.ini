# Ansible inventory
#
# [local]   - the host running the playbook. This is the group actually used by
#             the pipeline: deploy-app.yml runs here and reaches AKS through
#             kubectl, so no SSH and no remote host are needed. In this project
#             "here" is the Jenkins container, which has ansible and kubectl
#             installed (see jenkins/Dockerfile).
#
# [jenkins] - OPTIONAL. Only needed if you move the Jenkins controller from
#             your laptop onto an Azure VM, in which case jenkins-setup.yml
#             provisions it. Jenkins runs locally in this setup to avoid the
#             VM's hourly cost, so this group is normally unused. Replace
#             VM_PUBLIC_IP before using it.

[local]
localhost ansible_connection=local

[jenkins]
jenkins-vm ansible_host=VM_PUBLIC_IP

[jenkins:vars]
ansible_user=azureuser
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
