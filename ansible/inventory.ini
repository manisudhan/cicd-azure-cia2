# Ansible inventory
#
# [jenkins]  - the Azure VM that runs the Jenkins controller. Used by
#              jenkins-setup.yml for configuration management (one-time
#              provisioning of the CI server).
#
# [local]    - the machine running the playbook. Used by deploy-app.yml, which
#              talks to AKS through kubectl rather than over SSH, so it needs no
#              remote host.
#
# Replace VM_PUBLIC_IP with the public IP printed by infra/azure-setup.sh.

[jenkins]
jenkins-vm ansible_host=VM_PUBLIC_IP

[jenkins:vars]
ansible_user=azureuser
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3

[local]
localhost ansible_connection=local
