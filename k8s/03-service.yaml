# Azure provisions a Standard Load Balancer with a public IP for this Service.
# That public IP is the endpoint opened in a browser as deployment evidence.
apiVersion: v1
kind: Service
metadata:
  name: cicd-demo-app
  namespace: cicd-demo
  labels:
    app.kubernetes.io/name: cicd-demo-app
  annotations:
    # Asks Azure to attach a DNS label to the public IP it creates for this
    # Service, giving a stable hostname instead of a bare IP:
    #   cicd-demo-cia2.centralindia.cloudapp.azure.com
    # The label must be unique within the region. The name follows the public IP
    # resource, so it keeps working if the address itself ever changes.
    service.beta.kubernetes.io/azure-dns-label-name: cicd-demo-cia2
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: cicd-demo-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
